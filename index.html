<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Opération Brèche</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0c0f14;color:#dfe6ee;font-family:'Bahnschrift','Arial Narrow','Helvetica Neue',Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc(100vh*800/480));width:min(100vw,calc(100dvh*800/480));aspect-ratio:800/480}
canvas{width:100%;height:100%;display:block;cursor:crosshair;background:#10151d}
#ov{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.92);padding:14px;overflow:auto}
.box{max-width:540px;width:100%}
h1{font-size:clamp(28px,6vw,46px);color:#f2a900;letter-spacing:.04em;line-height:1;margin-bottom:6px}
h2{font-size:clamp(24px,5vw,38px);line-height:1;margin-bottom:8px}
.sub{color:#8fa3b8;margin-bottom:14px;font-size:15px}
ul{list-style:none;padding:0;margin:0 0 14px;font-size:15px;line-height:1.55}
li b{display:inline-block;min-width:92px;color:#f2a900}
input{font:inherit;font-size:16px;padding:9px 12px;width:100%;margin-bottom:12px;background:#151b26;border:1.5px solid #3a4256;color:#fff;border-radius:3px;-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid #3aa0e0;outline-offset:2px}
button{font:inherit;font-size:17px;padding:11px 22px;margin:0 8px 8px 0;background:#f2a900;color:#111;border:0;border-radius:3px;cursor:pointer;font-weight:700;letter-spacing:.03em}
button.alt{background:transparent;color:#f2a900;border:1.5px solid #f2a900}
button:hover{filter:brightness(1.12)}
.rk{font-size:14px;color:#aab8c6;margin:6px 0 14px;line-height:1.5}
.big{font-size:clamp(34px,8vw,56px);color:#f2a900;font-weight:700;line-height:1;margin:4px 0 10px}
.win{color:#5fd07a}.lose{color:#e0463a}
#touch,.hint,.stick,.tb,#rot{display:none}
body{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.touch #touch{display:block;position:fixed;inset:0;z-index:3;touch-action:none}
body.touch .hint{display:block;position:fixed;bottom:8vh;width:22vh;height:22vh;border:2px dashed rgba(244,232,208,.22);border-radius:50%;z-index:2;pointer-events:none}
#hL{left:5vw}#hR{right:5vw}
.stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(244,232,208,.55);background:rgba(244,232,208,.08);z-index:4;pointer-events:none}
.stick i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(242,169,0,.75)}
body.touch .stick.on{display:block}
body.touch .tb{display:block;position:fixed;right:3vw;width:76px;height:76px;margin:0;padding:0;border-radius:50%;z-index:4;font-size:12px;line-height:1.25;border:2px solid #f2a900;background:rgba(8,10,14,.65);color:#f2a900;touch-action:none;box-shadow:none}
#bC{top:26%}#bD{top:52%}
.tb.on{background:#f2a900!important;color:#111!important}
#rot{position:fixed;inset:0;z-index:20;background:#0c0f14;color:#f2a900;font-size:24px;line-height:1.4;text-align:center;align-items:center;justify-content:center}
@media (orientation:portrait){body.touch #rot{display:flex}}
</style>

const pat=(()=>{const c=document.createElement('canvas');c.width=c.height=16;const x=c.getContext('2d');
x.fillStyle='#262626';x.fillRect(0,0,16,16);x.strokeStyle='#f2a900';x.lineWidth=5;
x.beginPath();x.moveTo(-4,12);x.lineTo(12,-4);x.moveTo(4,20);x.lineTo(20,4);x.stroke();return g.createPattern(c,'repeat')})();

function reset(){
  map=M0.map(r=>r.split(''));en=[];bl=[];ch=[];pt=[];
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const t=map[r][c],x=c*T+T/2,y=r*T+T/2;
    if(t==='S'){P={x,y,hp:100,cd:0,a:0};map[r][c]='.'}
    else if(t==='X'){bomb={x,y,p:0};map[r][c]='.'}
    else if(t==='e'){en.push({x,y,hp:50,mh:50,al:0,alT:0,cd:.6,a:Math.PI,hx:x,hy:y,wt:0,wa:null,pt:0,nx:null,bc:0});map[r][c]='.'}
  }
  time=TL;charges=4;kills=0;shake=0;freeze=0;state='play';msg={t:0,s:''};
  $('ov').style.display='none';
}
const solid=(x,y)=>{const c=Math.floor(x/T),r=Math.floor(y/T);if(c<0||r<0||c>=C||r>=R)return true;const t=map[r][c];return t==='#'||t==='B'};
const free=(x,y,r)=>!(solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r));
function mv(e,dx,dy,r){if(free(e.x+dx,e.y,r))e.x+=dx;if(free(e.x,e.y+dy,r))e.y+=dy}
function los(a,b){const d=Math.hypot(b.x-a.x,b.y-a.y),n=Math.ceil(d/8);
  for(let i=1;i<n;i++){if(solid(a.x+(b.x-a.x)*i/n,a.y+(b.y-a.y)*i/n))return false}return true}
function shoot(x,y,a,sp,o){a+=(Math.random()-.5)*sp*2;const v=o==='p'?720:420;
  bl.push({x:x+Math.cos(a)*14,y:y+Math.sin(a)*14,vx:Math.cos(a)*v,vy:Math.sin(a)*v,o})}
function alertNear(x,y,d){for(const e of en)if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<d){e.al=1;e.alT=Math.max(e.alT,10)}}
// Chemin le plus court vers le joueur : un mur renforcé coûte plus cher qu'un passage libre
function nextStep(e){
  const sc=Math.floor(e.x/T),sr=Math.floor(e.y/T),gc=Math.floor(P.x/T),gr=Math.floor(P.y/T);
  if(sc===gc&&sr===gr)return{c:gc,r:gr};
  const D=new Array(C*R).fill(1e9),V=new Array(C*R).fill(0),S=sr*C+sc;
  D[gr*C+gc]=0;
  for(;;){
    let b=-1,bd=1e9;
    for(let i=0;i<C*R;i++)if(!V[i]&&D[i]<bd){bd=D[i];b=i}
    if(b<0||b===S)break;
    V[b]=1;
    const c=b%C,r=(b/C)|0,w=D[b]+(map[r][c]==='B'?10:1);
    for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nc=c+dc,nr=r+dr;
      if(nc<0||nr<0||nc>=C||nr>=R||map[nr][nc]==='#')continue;
      if(w<D[nr*C+nc])D[nr*C+nc]=w;
    }
  }
  let best=null,bv=1e9;
  for(const[dc,dr]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nc=sc+dc,nr=sr+dr;
    if(nc<0||nr<0||nc>=C||nr>=R||map[nr][nc]==='#')continue;
    if(D[nr*C+nc]<bv){bv=D[nr*C+nc];best={c:nc,r:nr}}
  }
  return best;
}
function chase(e,dt){
  if(e.pt<=0){e.pt=.35;e.nx=nextStep(e)}
  const n=e.nx;if(!n)return;
  const tx=n.c*T+T/2,ty=n.r*T+T/2,d=Math.hypot(tx-e.x,ty-e.y);
  e.a=Math.atan2(ty-e.y,tx-e.x);
  if(map[n.r][n.c]==='B'){
    if(d<T*1.3&&e.bc<=0&&!ch.some(k=>k.c===n.c&&k.r===n.r)){ch.push({c:n.c,r:n.r,t:2,o:'e'});e.bc=6;say('Charge ennemie posée !')}
    if(d>T*1.1)mv(e,Math.cos(e.a)*75*dt,Math.sin(e.a)*75*dt,10);
    return;
  }
  mv(e,Math.cos(e.a)*75*dt,Math.sin(e.a)*75*dt,10);
}
function wander(e,dt){
  e.wt-=dt;
  if(e.wt<=0){
    e.wt=1.2+Math.random()*2;
    e.wa=Math.hypot(e.hx-e.x,e.hy-e.y)>110?Math.atan2(e.hy-e.y,e.hx-e.x):(Math.random()<.3?null:Math.random()*6.28);
  }
  if(e.wa!==null){
    const x0=e.x,y0=e.y;
    mv(e,Math.cos(e.wa)*40*dt,Math.sin(e.wa)*40*dt,10);e.a=e.wa;
    if(e.x===x0&&e.y===y0)e.wt=0;
  }
}
function spark(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*160;
  pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.3+Math.random()*.4,c:col})}}
function say(s){msg={t:2.2,s}}
function killFx(){cur=KI[(kills-1)%KI.length];freeze=FREEZE;fz=0;mouse.down=false;snd()}

function explode(b){
  map[b.r][b.c]='.';
  const x=b.c*T+T/2,y=b.r*T+T/2;
  shake=.5;spark(x,y,40,'#f2a900');spark(x,y,20,'#fff');
  let k=0;
  if(b.o!=='e')for(const e of en)if(e.hp>0&&Math.hypot(e.x-x,e.y-y)<100){e.hp=0;kills++;k++;spark(e.x,e.y,16,'#e0463a')}
  if(k)killFx();
  if(Math.hypot(P.x-x,P.y-y)<75){P.hp-=35;say(b.o==='e'?'Brèche ennemie ! -35 PV':'Tir ami ! -35 PV')}
  alertNear(x,y,380);
}

function update(dt){
  time-=dt;if(shake>0)shake-=dt;if(msg.t>0)msg.t-=dt;
  let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(tmv){dx=tmv.x;dy=tmv.y}
  const l=Math.max(1,Math.hypot(dx,dy));
  mv(P,dx/l*150*dt,dy/l*150*dt,10);
  P.a=ta!==null?ta:Math.atan2(mouse.y-P.y,mouse.x-P.x);
  P.cd-=dt;
  if((mouse.down||tfire)&&P.cd<=0){P.cd=.12;shoot(P.x,P.y,P.a,.04,'p');alertNear(P.x,P.y,300)}

  // bombe
  const nearB=Math.hypot(P.x-bomb.x,P.y-bomb.y)<46;
  if(keys.KeyE&&nearB){
    if(bomb.p===0)say('Ils arrivent ! Tiens bon…');
    bomb.p+=dt/DEF;
    for(const e of en)if(e.hp>0){e.al=1;e.alT=999}
  }else bomb.p=Math.max(0,bomb.p-dt/DEF*.5);
  if(bomb.p>=1)return end(true);

  // charges
  for(const c of ch)c.t-=dt;
  for(const c of ch.filter(c=>c.t<=0))explode(c);
  ch=ch.filter(c=>c.t>0);

  // balles
  for(const b of bl){
    for(let s=0;s<3&&!b.dead;s++){
      b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;
      if(solid(b.x,b.y)){b.dead=1;spark(b.x,b.y,3,'#aab8c6');break}
      if(b.o==='p'){
        for(const e of en)if(e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<13){
          e.hp-=26;e.al=1;e.alT=10;b.dead=1;spark(e.x,e.y,6,'#e0463a');
          if(e.hp<=0){kills++;spark(e.x,e.y,14,'#e0463a');killFx()}break}
      }else if(Math.hypot(P.x-b.x,P.y-b.y)<12){P.hp-=10;b.dead=1;spark(P.x,P.y,5,'#3aa0e0');shake=.12}
    }
  }
  bl=bl.filter(b=>!b.dead);

  // ennemis
  for(const e of en){
    if(e.hp<=0)continue;
    const d=Math.hypot(P.x-e.x,P.y-e.y),sees=d<360&&los(e,P);
    e.bc-=dt;e.pt-=dt;
    if(sees){
      if(!e.al){e.al=1;e.cd=.4}
      e.alT=Math.max(e.alT,10);
      e.a=Math.atan2(P.y-e.y,P.x-e.x);e.cd-=dt;
      if(e.cd<=0){e.cd=.5+Math.random()*.3;shoot(e.x,e.y,e.a,.12,'e')}
      if(d>170)mv(e,Math.cos(e.a)*50*dt,Math.sin(e.a)*50*dt,10);
    }else if(e.al){
      e.alT-=dt;
      if(e.alT<=0)e.al=0;else chase(e,dt);
    }else wander(e,dt);
  }
  for(const p of pt){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}
  pt=pt.filter(p=>p.l>0);

  if(P.hp<=0)end(false,'OPÉRATEUR À TERRE');
  else if(time<=0)end(false,'TEMPS ÉCOULÉ');
}

function breach(){
  if(state!=='play'||charges<=0)return;
  let best=null,bd=62;
  for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(map[r][c]==='B'&&!ch.some(k=>k.c===c&&k.r===r)){
    const d=Math.hypot(c*T+T/2-P.x,r*T+T/2-P.y);if(d<bd){bd=d;best={c,r}}}
  if(best){charges--;ch.push({c:best.c,r:best.r,t:1.1});say('Charge posée… recule !')}
  else say('Aucun mur renforcé à portée');
}

function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*10*shake*2,(Math.random()-.5)*10*shake*2);
  g.fillStyle='#10151d';g.fillRect(0,0,W,H);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const t=map[r][c],x=c*T,y=r*T;
    if(t==='#'){g.fillStyle='#3a4256';g.fillRect(x,y,T,T);g.fillStyle='#4a5470';g.fillRect(x,y,T,3)}
    else if(t==='B'){g.fillStyle=pat;g.fillRect(x,y,T,T);g.strokeStyle='#f2a900';g.lineWidth=2;g.strokeRect(x+1,y+1,T-2,T-2)}
    else if((r+c)%2){g.fillStyle='#131a24';g.fillRect(x,y,T,T)}
  }
  for(const k of ch){if(Math.floor(k.t*10)%2){g.fillStyle='#e0463a';g.beginPath();g.arc(k.c*T+T/2,k.r*T+T/2,9,0,7);g.fill()}}
  // bombe
  g.fillStyle='#f2a900';g.fillRect(bomb.x-12,bomb.y-9,24,18);
  g.fillStyle='#111';g.font='700 10px sans-serif';g.textAlign='center';g.fillText('BOMBE',bomb.x,bomb.y+4);
  g.strokeStyle='rgba(242,169,0,'+(.3+.3*Math.sin(performance.now()/180))+')';g.lineWidth=2;g.beginPath();g.arc(bomb.x,bomb.y,24,0,7);g.stroke();
  if(bomb.p>0){g.fillStyle='#000';g.fillRect(bomb.x-24,bomb.y-26,48,6);g.fillStyle='#5fd07a';g.fillRect(bomb.x-24,bomb.y-26,48*bomb.p,6)}
  // ennemis
  for(const e of en){
    if(e.hp<=0){g.fillStyle='rgba(224,70,58,.3)';g.beginPath();g.arc(e.x,e.y,11,0,7);g.fill();continue}
    g.fillStyle='#c93c32';g.beginPath();g.arc(e.x,e.y,11,0,7);g.fill();
    g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(e.x,e.y);g.lineTo(e.x+Math.cos(e.a)*18,e.y+Math.sin(e.a)*18);g.stroke();
    if(e.al){g.fillStyle='#f2a900';g.font='700 14px sans-serif';g.textAlign='center';g.fillText('!',e.x,e.y-24)}
    if(e.hp<e.mh){g.fillStyle='#000';g.fillRect(e.x-12,e.y-19,24,4);g.fillStyle='#e0463a';g.fillRect(e.x-12,e.y-19,24*e.hp/e.mh,4)}
  }
  // joueur
  g.strokeStyle='#222';g.lineWidth=5;g.beginPath();g.moveTo(P.x,P.y);g.lineTo(P.x+Math.cos(P.a)*20,P.y+Math.sin(P.a)*20);g.stroke();
  g.fillStyle='#3aa0e0';g.beginPath();g.arc(P.x,P.y,11,0,7);g.fill();
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(P.x,P.y,11,0,7);g.stroke();
  for(const b of bl){g.fillStyle=b.o==='p'?'#fff3b0':'#ff8a7a';g.fillRect(b.x-2,b.y-2,4,4)}
  for(const p of pt){g.globalAlpha=Math.max(0,p.l*2);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)}
  g.globalAlpha=1;
  g.restore();
  // HUD
  g.fillStyle='rgba(8,10,14,.75)';g.fillRect(0,0,W,26);
  g.textAlign='left';g.font='700 13px sans-serif';g.fillStyle='#dfe6ee';g.fillText('PV',8,17);
  g.fillStyle='#222';g.fillRect(28,8,90,10);g.fillStyle=P.hp>35?'#5fd07a':'#e0463a';g.fillRect(28,8,90*Math.max(0,P.hp)/100,10);
  g.textAlign='center';g.fillStyle=time<30?'#e0463a':'#dfe6ee';
  g.fillText(Math.floor(Math.max(0,time)/60)+':'+String(Math.floor(Math.max(0,time)%60)).padStart(2,'0'),W/2,17);
  g.textAlign='right';g.fillStyle='#f2a900';
  g.fillText('Charges [F] : '+charges+'    Éliminés : '+kills+'/'+TOT,W-8,17);
  g.textAlign='center';g.font='700 15px sans-serif';
  const s=msg.t>0?msg.s:(bomb.p>0?'Désamorçage : '+Math.ceil((1-bomb.p)*DEF)+' s':(Math.hypot(P.x-bomb.x,P.y-bomb.y)<46?'Maintiens E ('+DEF+' s) pour désamorcer':''));
  if(s){g.fillStyle='rgba(8,10,14,.8)';g.fillRect(W/2-170,H-38,340,26);g.fillStyle='#f2a900';g.fillText(s,W/2,H-20)}
  if(freeze>0||state==='death')drawKill();
}
function drawKill(){
  g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,H);
  const k=Math.min(1,fz/.12),sc=.6+.4*(1-Math.pow(1-k,3));
  g.save();g.translate(W/2,H/2);g.scale(sc,sc);
  if(cur&&cur.complete&&cur.naturalWidth){
    const m=Math.min(W*.7/cur.naturalWidth,H*.8/cur.naturalHeight,1.5),w=cur.naturalWidth*m,h=cur.naturalHeight*m;
    g.drawImage(cur,-w/2,-h/2,w,h);
  }else{
    g.textAlign='center';g.font='80px sans-serif';g.fillText('💀',0,-10);
    g.font='700 44px Impact,sans-serif';g.fillStyle='#e0463a';g.fillText('ÉLIMINÉ',0,50);
  }
  g.restore();
}

function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(state==='play'){if(isTouch&&innerHeight>innerWidth){}else if(freeze>0){freeze-=dt;fz+=dt}else update(dt)}
  if(isTouch)updBtn();
  else if(state==='death'){deathT-=dt;fz+=dt;if(deathT<=0)showEnd(false,pend)}
  if(map)draw();
  requestAnimationFrame(loop);
}

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ranking(){try{return JSON.parse(localStorage.getItem('brech_r')||'[]')}catch(e){return[]}}
function end(win,why){
  if(state!=='play')return;
  if(!win&&why==='OPÉRATEUR À TERRE'){state='death';deathT=2.2;fz=0;cur=DI;pend=why;mouse.down=false;snd();return}
  showEnd(win,why);
}
function showEnd(win,why){
  state='end';
  const used=Math.round(TL-time);
  const score=win?Math.round(1000+Math.max(0,time)*10+kills*150+P.hp*5):0;
  let rk=ranking();
  if(win){rk.push({n:name||'Anonyme',s:score});rk.sort((a,b)=>b.s-a.s);rk=rk.slice(0,5);
    try{localStorage.setItem('brech_r',JSON.stringify(rk))}catch(e){}}
  const txt='Opération Brèche : '+(name||'Anonyme')+' a désamorcé la bombe en '+used+' s avec '+kills+' éliminés = '+score+' points. Tu fais mieux ?';
  $('ov').style.display='flex';
  $('ov').innerHTML='<div class="box"><h2 class="'+(win?'win':'lose')+'">'+(win?'BOMBE DÉSAMORCÉE':why)+'</h2>'
   +(win?'<div class="big">'+score+' pts</div><p class="sub">'+used+' s, '+kills+'/'+TOT+' éliminés, '+Math.max(0,P.hp)+' PV restants</p>':'<p class="sub">'+kills+'/'+TOT+' éliminés. La bombe est toujours active.</p>')
   +(rk.length?'<div class="rk"><b>Meilleurs scores (cet appareil)</b><br>'+rk.map((r,i)=>(i+1)+'. '+esc(r.n)+' : '+r.s).join('<br>')+'</div>':'')
   +'<button id="rp">Rejouer</button>'+(win?'<button class="alt" id="cp">Copier mon score</button>':'')+'</div>';
  $('rp').onclick=reset;$('rp').focus();
  if(win)$('cp').onclick=()=>{
    const done=()=>{$('cp').textContent='Copié !'};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(done,()=>prompt('Copie ce texte :',txt));else prompt('Copie ce texte :',txt);
  };
}

function unlockAudio(){try{SND.muted=true;const p=SND.play(),d=()=>{SND.pause();SND.currentTime=0;SND.muted=false};if(p&&p.then)p.then(d,d);else d()}catch(e){}}
function menu(){
  $('ov').innerHTML='<div class="box"><h1>OPÉRATION BRÈCHE</h1><p class="sub">Pénètre dans le bâtiment, fais sauter les murs renforcés et désamorce la bombe avant la fin du temps imparti.</p>'
   +(isTouch?'<ul><li><b>Stick gauche</b>se déplacer</li><li><b>Stick droit</b>viser et tirer (garde le doigt posé)</li><li><b>CHARGE</b>poser une charge sur un mur renforcé (jaune et noir)</li><li><b>BOMBE</b>maintenir près de la bombe pour désamorcer ('+DEF+' s)</li></ul><p class="sub">Joue en mode paysage.</p>'
   :'<ul><li><b>ZQSD / WASD</b>se déplacer</li><li><b>Souris</b>viser, clic gauche pour tirer</li><li><b>F</b>poser une charge sur un mur renforcé (jaune et noir)</li><li><b>E (maintenu)</b>désamorcer la bombe ('+DEF+' s)</li></ul>')
   +'<p class="sub">Attention : l’explosion blesse aussi les opérateurs trop proches. Les défenseurs patrouillent, entendent les tirs, posent leurs propres charges sur les murs renforcés et viendront tous vers toi pendant le désamorçage.</p>'
   +'<input id="pn" maxlength="14" placeholder="Ton pseudo" value="'+esc(name)+'">'
   +'<button id="st">Lancer l’assaut</button></div>';
  $('st').onclick=()=>{unlockAudio();name=$('pn').value.trim();try{localStorage.setItem('brech_n',name)}catch(e){}reset()};
}

const pos=e=>{ta=null;const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height};
cv.addEventListener('mousemove',pos);
cv.addEventListener('mousedown',e=>{pos(e);mouse.down=true});
addEventListener('mouseup',()=>mouse.down=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  keys[e.code]=1;
  if(e.code==='KeyF'&&!e.repeat)breach();
  if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();
});
addEventListener('keyup',e=>{keys[e.code]=0});
/* ---------- Commandes tactiles ---------- */
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');
const SR=55,sticks={};
let lastC=-1;
function updBtn(){if(lastC!==charges){lastC=charges;$('bC').innerHTML='CHARGE<br>'+charges}}
function knob(side,dx,dy){$('s'+side).firstElementChild.style.transform='translate('+dx+'px,'+dy+'px)'}
function stickOn(side,x,y){const s=$('s'+side);s.style.left=x+'px';s.style.top=y+'px';s.classList.add('on');$('h'+side).style.display='none';knob(side,0,0)}
function stickOff(side){$('s'+side).classList.remove('on');$('h'+side).style.display=''}
const tz=$('touch');
tz.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const side=t.clientX<innerWidth/2?'L':'R';
    if(Object.values(sticks).some(s=>s.side===side))continue;
    sticks[t.identifier]={side,sx:t.clientX,sy:t.clientY};
    stickOn(side,t.clientX,t.clientY);
    if(side==='R'){tfire=true;if(P)ta=P.a}
  }
},{passive:false});
tz.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const s=sticks[t.identifier];if(!s)continue;
    let dx=t.clientX-s.sx,dy=t.clientY-s.sy;const m=Math.hypot(dx,dy);
    if(m>SR){dx*=SR/m;dy*=SR/m}
    knob(s.side,dx,dy);
    if(s.side==='L')tmv=m<SR*.18?null:{x:dx/SR,y:dy/SR};
    else if(m>12)ta=Math.atan2(t.clientY-s.sy,t.clientX-s.sx);
  }
},{passive:false});
const tend=e=>{
  for(const t of e.changedTouches){
    const s=sticks[t.identifier];if(!s)continue;
    delete sticks[t.identifier];stickOff(s.side);
    if(s.side==='L')tmv=null;else tfire=false;
  }
};
tz.addEventListener('touchend',tend);tz.addEventListener('touchcancel',tend);
function bindBtn(id,down,up){
  const b=$(id);
  b.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();b.classList.add('on');down()},{passive:false});
  const u=e=>{e.preventDefault();b.classList.remove('on');if(up)up()};
  b.addEventListener('touchend',u);b.addEventListener('touchcancel',u);
}
bindBtn('bC',()=>breach());
bindBtn('bD',()=>{keys.KeyE=1},()=>{keys.KeyE=0});

reset();state='menu';menu();$('ov').style.display='flex';
requestAnimationFrame(loop);
</script>
